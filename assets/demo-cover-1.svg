<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c06"/>
      <stop offset="45%" stop-color="#241408"/>
      <stop offset="85%" stop-color="#0a0502"/>
      <stop offset="100%" stop-color="#050301"/>
    </linearGradient>
    <radialGradient id="amberAura" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#78350f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="600" fill="url(#warmGrad)"/>
  <circle cx="300" cy="270" r="230" fill="url(#amberAura)"/>

  <!-- Audiophile Sound Waveform Core -->
  <g transform="translate(300, 270)">
    <!-- Concentric Resonator Rings -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="rgba(254, 240, 138, 0.22)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="rgba(245, 158, 11, 0.45)" stroke-width="2"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#goldRim)" stroke-width="3"/>

    <!-- Acoustic Wave Bars -->
    <rect x="-60" y="-20" width="8" height="40" rx="4" fill="#fef08a"/>
    <rect x="-42" y="-38" width="8" height="76" rx="4" fill="#f59e0b"/>
    <rect x="-24" y="-55" width="8" height="110" rx="4" fill="#fbbf24"/>
    <rect x="-6" y="-70" width="12" height="140" rx="6" fill="#ffffff" filter="drop-shadow(0 0 10px #f59e0b)"/>
    <rect x="16" y="-55" width="8" height="110" rx="4" fill="#fbbf24"/>
    <rect x="34" y="-38" width="8" height="76" rx="4" fill="#f59e0b"/>
    <rect x="52" y="-20" width="8" height="40" rx="4" fill="#fef08a"/>
  </g>

  <!-- Horizon Wave lines -->
  <path d="M50 430 Q 175 390 300 430 T 550 430" fill="none" stroke="rgba(254, 240, 138, 0.3)" stroke-width="2"/>
  <path d="M70 455 Q 185 415 300 455 T 530 455" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5"/>

  <!-- Typography -->
  <text x="300" y="505" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="900" letter-spacing="8" fill="#ffffff" text-anchor="middle">ACOUSTIC HORIZON</text>
  <text x="300" y="535" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#f59e0b" text-anchor="middle">HIGH FIDELITY • STUDIO SESSIONS</text>
</svg>
